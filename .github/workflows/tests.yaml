name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  THEFLOW_TEMP_PATH: ./tmp

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # kept in sync with the version that produced uv.lock
          version: "0.11.13"
          python-version: "3.10"
          enable-cache: true

      - name: Print environment
        run: |
          uv --version
          uv python list --only-installed

      # llama-cpp-python has no wheel on every platform and is optional for this
      # project, so it is excluded from the install.
      - name: Install dependencies
        run: uv sync --frozen --python 3.10 --no-install-package llama-cpp-python

      # test_qa.py is not collectable (it imports `index` as a top-level module).
      # tools/tests covers the evaluation harness and the doctor self-check: those
      # decide the numbers quoted in the README, so they must not drift unnoticed.
      - name: Run tests
        run: >
          .venv/bin/python -m pytest
          libs/ktem/ktem_tests
          libs/kotaemon/tests/test_ocr_pdf_reader.py
          libs/kotaemon/tests/test_pptx_reader.py
          tools/tests
          -q --ignore=libs/ktem/ktem_tests/test_qa.py

      # Only the modules this fork added are worth reporting: whole-repository
      # coverage sits around 5% because the upstream framework is mostly untouched.
      # Kept as a report on purpose - the >=80% floor for the three added modules is
      # still to be confirmed on this runner before it becomes a gate (ROADMAP A2).
      - name: Coverage of the added modules
        run: |
          .venv/bin/python -m coverage run \
            --source=libs/ktem/ktem/utils,libs/kotaemon/kotaemon/loaders,libs/ktem/ktem/index/file \
            -m pytest libs/ktem/ktem_tests -q --ignore=libs/ktem/ktem_tests/test_qa.py
          .venv/bin/python -m coverage report --include="*/i18n.py,*/selector.py,*/ocr_pdf_loader.py,*/repair.py"

  # The React UI is committed as a build (web/dist) so the Python job - and any
  # checkout - runs without Node. This job proves the committed artefact can be
  # rebuilt from the sources in web/ (MODIFICATIONS §5.25).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node --test runs the TypeScript test files through native type
          # stripping, which needs Node 22.6+; the project is developed on 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build artefact exists
        run: test -f dist/index.html && ls -lh dist dist/assets
