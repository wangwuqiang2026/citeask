<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>citeask · web UI not packaged</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #111827;
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(560px, calc(100vw - 48px));
        padding: 28px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
      }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0 0 12px; color: #4b5563; }
      code {
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        background: #f1f3f7;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>citeask 的 web 界面还没有被打包</h1>
      <p>
        这是 Python 包内的占位页。源码目录运行时由 <code>web/dist</code> 提供界面；
        如果你是从 wheel 安装的，请在有 Node 的机器上执行：
      </p>
      <p><code>.\scripts\build_web.ps1 -CopyToPackage</code></p>
      <p>
        然后把 <code>libs/ktem/ktem/web/dist</code> 一并打包。经典界面仍可从
        <a href="/legacy">/legacy</a> 打开。
      </p>
    </main>
  </body>
</html>
